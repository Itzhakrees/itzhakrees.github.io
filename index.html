<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Game systems, gameplay, and level design portfolio for Itzhakrees."
    />
    <title>Itzhakrees | Game Systems & Level Designer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/utilities.css?v=20261020-hig" />
    <link rel="stylesheet" href="css/style.css?v=20261020-hig" />
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="skipLink"></a>

    <header class="site-header">
      <nav class="nav container" aria-label="Primary navigation">
        <a class="brand" href="#top" aria-label="Itzhakrees portfolio home">
          <span class="brand-mark">IR</span>
          <span class="brand-text">Itzhakrees</span>
        </a>

        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="primary-menu"
          aria-label="Open navigation"
          data-i18n-aria-label="navOpen"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="nav-menu" id="primary-menu">
          <a href="#projects" data-i18n="navProjects"></a>
          <a href="#research" data-i18n="navResearch"></a>
          <button class="language-toggle" type="button" data-language-toggle aria-pressed="false"></button>
        </div>
      </nav>
    </header>

    <main id="main">
      <section class="intro section" id="top">
        <div class="container intro-grid">
          <img
            class="intro-avatar"
            src="img/Me.jpg"
            alt="Itzhakrees"
            width="460"
            height="460"
            fetchpriority="high"
          />
          <div class="intro-main">
            <p class="eyebrow" data-i18n="introEyebrow"></p>
            <h1 data-i18n="introName"></h1>
            <p class="intro-role" data-i18n="introRole"></p>
            <p class="intro-copy" data-i18n="introCopy"></p>
            <aside class="intro-aside" aria-label="Focus" data-i18n-aria-label="introAsideLabel">
              <span data-i18n="introFocusLabel"></span>
              <strong data-i18n="introFocus"></strong>
            </aside>
          </div>
        </div>
      </section>

      <section class="section projects-section" id="projects">
        <div class="container">
          <div class="section-heading">
            <p class="eyebrow" data-i18n="projectsEyebrow"></p>
            <h2 data-i18n="projectsTitle"></h2>
            <p data-i18n="projectsIntro"></p>
          </div>

          <div class="project-filters" data-project-filters role="group"></div>
          <div class="project-grid" data-projects></div>
          <p class="project-empty" data-project-empty role="status" hidden></p>
        </div>
      </section>

      <section class="section research-section" id="research">
        <div class="container">
          <div class="section-heading">
            <p class="eyebrow" data-i18n="researchEyebrow"></p>
            <h2 data-i18n="researchTitle"></h2>
            <p data-i18n="researchIntro"></p>
          </div>

          <div data-research></div>
        </div>
      </section>

      <!-- Future portfolio sections can be added here. -->
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p data-i18n="footerCopyright"></p>
        <p data-i18n="footerCredit"></p>
      </div>
    </footer>

    <script src="js/content.generated.js?v=20261020-hig"></script>
    <script src="js/script.js?v=20260721-build-project-order"></script>
  </body>
</html>
